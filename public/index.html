<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Client Tracker
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


  <main class="container">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <header class="page-header">

      <div>

        <h1>
          Client Tracker
        </h1>

        <p>
          Record client details and track attendance and interest.
        </p>

      </div>


      <div
        class="db-status"
        id="dbStatus"
      >
        Connecting...
      </div>

    </header>



    <!-- ==================================================
         ADD / EDIT CLIENT
    =================================================== -->

    <section class="card form-card">


      <div class="section-title">

        <h2 id="formTitle">
          Add Client
        </h2>


        <button
          type="button"
          class="secondary hidden"
          id="cancelEditBtn"
        >
          Cancel Edit
        </button>

      </div>



      <form id="clientForm">


        <input
          type="hidden"
          id="clientId"
        >


        <div class="form-grid">


          <!-- CLIENT NAME -->

          <label>

            Client Name

            <input
              id="name"
              type="text"
              placeholder="Enter client name"
              autocomplete="name"
              required
            >

          </label>



          <!-- PHONE -->

          <label>

            Phone Number

            <input
              id="phone"
              type="tel"
              placeholder="Enter phone number"
              autocomplete="tel"
              required
            >

          </label>



          <!-- GYM -->

          <label>

            Gym Name

            <input
              id="gymName"
              type="text"
              placeholder="Enter gym name"
              autocomplete="organization"
            >

          </label>



          <!-- ATTENDANCE -->

          <label>

            Attendance

            <select id="attendance">

              <option value="None">
                None
              </option>

              <option value="Attended">
                Attended
              </option>

              <option value="Not Attended">
                Not Attended
              </option>

            </select>

          </label>



          <!-- INTEREST -->

          <label>

            Interest

            <select id="interest">

              <option value="None">
                None
              </option>

              <option value="Interested">
                Interested
              </option>

              <option value="Not Interested">
                Not Interested
              </option>

            </select>

          </label>



          <!-- REMARKS -->

          <label class="full-width">

            Remarks

            <textarea
              id="remarks"
              rows="3"
              placeholder="Add any additional remarks..."
            ></textarea>

          </label>


        </div>



        <button
          class="primary"
          type="submit"
          id="saveBtn"
        >
          Add Client
        </button>


      </form>

    </section>



    <!-- ==================================================
         FILTERS
    =================================================== -->

    <section class="card filter-card">


      <div class="table-header">


        <div>

          <h2>
            Client Records
          </h2>

          <span id="recordCount">
            0 records
          </span>

        </div>


        <button
          type="button"
          class="secondary"
          id="clearFiltersBtn"
        >
          Clear Filters
        </button>


      </div>



      <div class="filter-grid">


        <!-- SEARCH -->

        <label>

          Search

          <input
            id="searchInput"
            type="search"
            placeholder="Name, phone, gym or remarks..."
          >

        </label>



        <!-- GYM FILTER -->

        <label>

          Gym Name

          <select id="gymFilter">

            <option value="">
              All Gyms
            </option>

          </select>

        </label>



        <!-- ATTENDANCE FILTER -->

        <label>

          Attendance

          <select id="attendanceFilter">

            <option value="">
              All Attendance
            </option>

            <option value="None">
              None
            </option>

            <option value="Attended">
              Attended
            </option>

            <option value="Not Attended">
              Not Attended
            </option>

          </select>

        </label>



        <!-- INTEREST FILTER -->

        <label>

          Interest

          <select id="interestFilter">

            <option value="">
              All Interest
            </option>

            <option value="None">
              None
            </option>

            <option value="Interested">
              Interested
            </option>

            <option value="Not Interested">
              Not Interested
            </option>

          </select>

        </label>


      </div>

    </section>



    <!-- ==================================================
         CLIENT TABLE
    =================================================== -->

    <section class="card">


      <div class="table-wrapper">


        <table>


          <thead>

            <tr>

              <th>
                #
              </th>

              <th>
                Client
              </th>

              <th>
                Phone
              </th>

              <th>
                Gym
              </th>

              <th>
                Attendance
              </th>

              <th>
                Interest
              </th>

              <th>
                Remarks
              </th>

              <th>
                Added
              </th>

              <th>
                Actions
              </th>

            </tr>

          </thead>



          <tbody
            id="clientTableBody"
          >
          </tbody>


        </table>



        <div
          class="empty"
          id="emptyState"
        >
          No client records found.
        </div>


      </div>


    </section>


  </main>



  <!-- ==================================================
       TOAST
  =================================================== -->

  <div
    class="toast"
    id="toast"
  >
  </div>



  <script src="app.js"></script>


</body>

</html>
