<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Client Tracker</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="container">

    <!-- PAGE HEADER -->
    <header class="page-header">

      <div>
        <h1>Client Tracker</h1>

        <p>
          Record client details and track attendance and interest.
        </p>
      </div>

      <div
        class="db-status"
        id="dbStatus">
        Connecting...
      </div>

    </header>


    <!-- ADD / EDIT FORM -->
    <section class="card form-card">

      <div class="section-title">

        <h2 id="formTitle">
          Add Client
        </h2>

        <button
          type="button"
          class="secondary hidden"
          id="cancelEditBtn">

          Cancel Edit

        </button>

      </div>


      <form id="clientForm">

        <!-- MongoDB _id -->
        <input
          type="hidden"
          id="clientId"
        >


        <div class="form-grid">

          <!-- NAME -->
          <label>

            Client Name

            <input
              id="name"
              type="text"
              placeholder="Enter client name"
              autocomplete="name"
              required
            >

          </label>


          <!-- PHONE -->
          <label>

            Phone Number

            <input
              id="phone"
              type="tel"
              placeholder="Enter phone number"
              autocomplete="tel"
              required
            >

          </label>


          <!-- ATTENDANCE -->
          <label>

            Attendance

            <select id="attendance">

              <option value="Not Attended">
                Not Attended
              </option>

              <option value="Attended">
                Attended
              </option>

            </select>

          </label>


          <!-- INTEREST -->
          <label>

            Interest

            <select id="interest">

              <option value="Not Interested">
                Not Interested
              </option>

              <option value="Interested">
                Interested
              </option>

            </select>

          </label>


          <!-- REMARKS -->
          <label class="full-width">

            Remarks

            <textarea
              id="remarks"
              rows="3"
              placeholder="Add any additional remarks..."
            ></textarea>

          </label>

        </div>


        <button
          class="primary"
          type="submit"
          id="saveBtn">

          Add Client

        </button>

      </form>

    </section>


    <!-- CLIENT TABLE -->
    <section class="card">

      <div class="table-header">

        <div>

          <h2>
            Client Records
          </h2>

          <span id="recordCount">
            0 records
          </span>

        </div>


        <input
          class="search"
          id="searchInput"
          type="search"
          placeholder="Search name, number or remarks..."
        >

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>#</th>

              <th>Client</th>

              <th>Phone</th>

              <th>Attendance</th>

              <th>Interest</th>

              <th>Remarks</th>

              <th>Added</th>

              <th>Actions</th>

            </tr>

          </thead>


          <tbody id="clientTableBody">
          </tbody>

        </table>


        <div
          class="empty"
          id="emptyState">

          No client records found.

        </div>

      </div>

    </section>

  </main>


  <!-- TOAST -->
  <div
    class="toast"
    id="toast">
  </div>


  <script src="app.js"></script>

</body>
</html>
