<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Client Details Tracker</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />
</head>

<body>

  <div class="container">

    <!-- ==================================================
         HEADER
    =================================================== -->

    <header class="page-header">

      <div>
        <h1>Client Details Tracker</h1>

        <p>
          Manage your hotel and gym clients
        </p>
      </div>

      <div
        id="dbStatus"
        class="db-status"
      >
        Checking database...
      </div>

    </header>


    <!-- ==================================================
         CLIENT FORM
    =================================================== -->

    <section class="card">

      <div class="section-header">

        <h2 id="formTitle">
          Add New Client
        </h2>

      </div>

      <form id="clientForm">

        <input
          type="hidden"
          id="clientId"
        />


        <div class="form-grid">

          <!-- CLIENT NAME -->

          <div class="form-group">

            <label for="name">
              Client Name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Enter client name"
              required
            />

          </div>


          <!-- PHONE -->

          <div class="form-group">

            <label for="phone">
              Phone Number
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="Enter phone number"
              required
            />

          </div>


          <!-- CLIENT CATEGORY -->

          <div class="form-group">

            <label for="clientCategory">
              Client Category
            </label>

            <select
              id="clientCategory"
              required
            >

              <option value="Gym">
                Gym
              </option>

              <option value="Hotel">
                Hotel
              </option>

            </select>

          </div>


          <!-- GYM NAME -->

          <div class="form-group">

            <label for="gymName">
              Gym Name
            </label>

            <input
              type="text"
              id="gymName"
              placeholder="Enter gym name"
            />

          </div>


          <!-- ATTENDANCE -->

          <div class="form-group">

            <label for="attendance">
              Attendance
            </label>

            <select id="attendance">

              <option value="None">
                None
              </option>

              <option value="Attended">
                Attended
              </option>

              <option value="Not Attended">
                Not Attended
              </option>

            </select>

          </div>


          <!-- INTEREST -->

          <div class="form-group">

            <label for="interest">
              Interest
            </label>

            <select id="interest">

              <option value="None">
                None
              </option>

              <option value="Interested">
                Interested
              </option>

              <option value="Not Interested">
                Not Interested
              </option>

            </select>

          </div>


          <!-- REMARKS -->

          <div class="form-group full-width">

            <label for="remarks">
              Remarks
            </label>

            <textarea
              id="remarks"
              rows="3"
              placeholder="Enter remarks"
            ></textarea>

          </div>

        </div>


        <!-- FORM BUTTONS -->

        <div class="form-actions">

          <button
            type="submit"
            class="btn btn-primary"
            id="saveButton"
          >
            Add Client
          </button>

          <button
            type="button"
            class="btn btn-secondary hidden"
            id="cancelButton"
          >
            Cancel
          </button>

        </div>

      </form>

    </section>


    <!-- ==================================================
         FILTERS
    =================================================== -->

    <section class="card">

      <div class="section-header">

        <h2>
          Search & Filter
        </h2>

        <button
          type="button"
          class="btn btn-secondary"
          id="clearFiltersButton"
        >
          Clear Filters
        </button>

      </div>


      <div class="filter-grid">

        <!-- SEARCH -->

        <div class="form-group">

          <label for="searchInput">
            Search
          </label>

          <input
            type="text"
            id="searchInput"
            placeholder="Search name, phone, gym, remarks..."
          />

        </div>


        <!-- CLIENT CATEGORY FILTER -->

        <div class="form-group">

          <label for="categoryFilter">
            Client Category
          </label>

          <select id="categoryFilter">

            <option value="">
              All Categories
            </option>

            <option value="Gym">
              Gym
            </option>

            <option value="Hotel">
              Hotel
            </option>

          </select>

        </div>


        <!-- GYM FILTER -->

        <div class="form-group">

          <label for="gymFilter">
            Gym Name
          </label>

          <select id="gymFilter">

            <option value="">
              All Gyms
            </option>

          </select>

        </div>


        <!-- ATTENDANCE FILTER -->

        <div class="form-group">

          <label for="attendanceFilter">
            Attendance
          </label>

          <select id="attendanceFilter">

            <option value="">
              All Attendance
            </option>

            <option value="None">
              None
            </option>

            <option value="Attended">
              Attended
            </option>

            <option value="Not Attended">
              Not Attended
            </option>

          </select>

        </div>


        <!-- INTEREST FILTER -->

        <div class="form-group">

          <label for="interestFilter">
            Interest
          </label>

          <select id="interestFilter">

            <option value="">
              All Interest
            </option>

            <option value="None">
              None
            </option>

            <option value="Interested">
              Interested
            </option>

            <option value="Not Interested">
              Not Interested
            </option>

          </select>

        </div>

      </div>

    </section>


    <!-- ==================================================
         CLIENT TABLE
    =================================================== -->

    <section class="card">

      <div class="section-header">

        <div>

          <h2>
            Clients
          </h2>

          <span
            id="clientCount"
            class="client-count"
          >
            0 clients
          </span>

        </div>

      </div>


      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>#</th>

              <th>Client</th>

              <th>Phone</th>

              <th>Category</th>

              <th>Gym</th>

              <th>Attendance</th>

              <th>Interest</th>

              <th>Remarks</th>

              <th>Added</th>

              <th>Actions</th>

            </tr>

          </thead>


          <tbody id="clientTableBody">

            <tr>

              <td
                colspan="10"
                class="loading"
              >
                Loading clients...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </div>


  <!-- ==================================================
       TOAST
  =================================================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <script src="app.js"></script>

</body>
</html>
